services:
  backend:
    build: .
    container_name: hotelaria_backend
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    depends_on:
      - db
    volumes:
      - .:/app
    command: npm run start:dev

  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hotel_db
    ports:
      - "5432:5432"
